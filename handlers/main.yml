---

- name: update grub
  ansible.builtin.command: update-grub
  notify: mark reboot required
  when:
      - not ubtu20stig_skip_for_travis
      - not ubtu20stig_system_is_container

- name: reload gdm
  ansible.builtin.command: dpkg-reconfigure gdm3

- name: dconf update
  ansible.builtin.command: dconf update
  when:
      - ubtu20stig_desktop_required

- name: restart sshd
  ansible.builtin.service:
      name: sshd
      state: restarted
  when:
      - "'openssh-server' in ansible_facts.packages"

- name: restart chrony
  ansible.builtin.service:
      name: chrony
      state: restarted

- name: Check running audit rule mutability
  ansible.builtin.command: auditctl -s
  changed_when: false
  check_mode: false
  register: ubtu20stig_audit_status
  listen:
      - reload auditd
      - restart auditd

- name: Mark deferred immutable audit changes for reboot
  ansible.builtin.file:
      path: /run/ubtu20stig-reboot-required
      state: touch
      owner: root
      group: root
      mode: '0600'
      access_time: preserve
      modification_time: preserve
  when:
      - ubtu20stig_audit_status.stdout is search('(?m)^enabled\s+2\s*$')
  listen:
      - reload auditd
      - restart auditd

- name: reload kernel system
  ansible.builtin.shell: sysctl --system

- name: reload auditd
  # Immutable rules can only be activated after reboot; still build the disk rules.
  ansible.builtin.command: "{{ (ubtu20stig_audit_status.stdout is search('(?m)^enabled\\s+2\\s*$')) | ternary('augenrules', 'augenrules --load') }}"

- name: restart auditd
  ansible.builtin.service:
      name: auditd
      state: restarted
  when:
      - ubtu20stig_audit_status.stdout is not search('(?m)^enabled\s+2\s*$')

- name: restart rsyslog
  ansible.builtin.service:
      name: rsyslog
      state: restarted

- name: sysctl flush ipv4 route table
  ansible.posix.sysctl:
      name: net.ipv4.route.flush
      value: '1'
      sysctl_set: true
  when: ansible_virtualization_type != "docker"

- name: mark reboot required
  ansible.builtin.file:
      path: /run/ubtu20stig-reboot-required
      state: touch
      owner: root
      group: root
      mode: '0600'
      access_time: preserve
      modification_time: preserve
