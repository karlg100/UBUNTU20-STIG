---
name: Community CI

"on":
  pull_request:
    branches: [devel, main]
  push:
    branches: [devel, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: YAML, workflow and Ansible checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
      ANSIBLE_LOCAL_TEMP: ${{ github.workspace }}/.ansible/tmp
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: python -m pip install -r .ci/requirements.txt

      - name: Install validation collections
        run: ansible-galaxy collection install -r .ci/collections.yml

      - name: Lint YAML, including workflows
        run: yamllint --strict .

      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Check role syntax without running remediation
        run: ansible-playbook --syntax-check -i localhost, site.yml

      - name: Lint the role
        run: ansible-lint --offline site.yml
